name: Python Checks

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.8"
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Mypy (type check)
        run: |
          uv run mypy .
